{% extends 'news/base.html' %}{% block content %}<h1>Articles awaiting approval</h1>{% for article in articles %}<section class="card"><h2>{{ article.title }}</h2><p>{{ article.content|truncatewords:50 }}</p><form method="post" action="{% url 'approve-article' article.pk %}">{% csrf_token %}<button type="submit">Approve article</button></form></section>{% empty %}<p class="card">There are no articles waiting for review.</p>{% endfor %}{% endblock %}
