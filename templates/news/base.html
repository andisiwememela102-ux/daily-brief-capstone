<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}The Daily Brief{% endblock %}</title>
<style>body{margin:0;font:16px/1.6 Arial,sans-serif;background:#f4f6f8;color:#172536}.wrap{max-width:1000px;margin:auto;padding:24px}.bar{background:#102b46;color:white}.bar a{color:white;margin-right:18px;text-decoration:none}.brand{font-size:1.5rem;font-weight:bold}.card{background:white;padding:22px;margin:18px 0;border-radius:10px;box-shadow:0 2px 12px #14283b12}a{color:#1763a5}button{background:#bd994e;color:white;border:0;padding:10px 16px;border-radius:5px;cursor:pointer}.muted{color:#657587}.message{padding:10px;background:#e5f5e9}</style></head>
<body><header class="bar"><div class="wrap"><span class="brand">The Daily Brief</span><nav style="float:right"><a href="{% url 'home' %}">Home</a><a href="{% url 'newsletter-list' %}">Newsletters</a>{% if user.is_authenticated %}{% if user.role == 'editor' %}<a href="{% url 'review-articles' %}">Review articles</a>{% endif %}<form method="post" action="{% url 'logout' %}" style="display:inline">{% csrf_token %}<button type="submit">Log out</button></form>{% else %}<a href="{% url 'login' %}">Log in</a><a href="{% url 'register' %}">Register</a>{% endif %}</nav></div></header><main class="wrap">{% for message in messages %}<p class="message">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
